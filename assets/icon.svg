<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1B2A4A"/>
      <stop offset="1" stop-color="#0A1020"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.42" r="0.55">
      <stop offset="0" stop-color="#2DD4BF" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#2DD4BF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="wire" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#34D399"/>
      <stop offset="1" stop-color="#38BDF8"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.02"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
  </defs>

  <!-- macOS icon grid: 824pt squircle-ish tile inset 100pt -->
  <g filter="url(#shadow)">
    <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
  </g>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#glow)"/>
  <rect x="102" y="102" width="820" height="820" rx="183" fill="none" stroke="url(#rim)" stroke-width="4"/>

  <!-- tunnel rings -->
  <g fill="none" stroke="#38BDF8" stroke-opacity="0.10" stroke-width="6">
    <circle cx="512" cy="512" r="300"/>
    <circle cx="512" cy="512" r="230"/>
  </g>

  <!-- the wire "W": glow underlay, then the stroke -->
  <path id="w" d="M300 350 L404 676 L512 462 L620 676 L724 350"
        fill="none" stroke="url(#wire)" stroke-width="62" stroke-linecap="round" stroke-linejoin="round"
        filter="url(#soft)" opacity="0.55"/>
  <path d="M300 350 L404 676 L512 462 L620 676 L724 350"
        fill="none" stroke="url(#wire)" stroke-width="54" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- peers -->
  <g stroke-width="18">
    <circle cx="300" cy="320" r="50" fill="#0A1020" stroke="#34D399"/>
    <circle cx="724" cy="320" r="50" fill="#0A1020" stroke="#38BDF8"/>
  </g>
  <circle cx="300" cy="320" r="18" fill="#34D399"/>
  <circle cx="724" cy="320" r="18" fill="#38BDF8"/>

  <!-- packet in flight -->
  <circle cx="458" cy="569" r="30" fill="#FFFFFF" filter="url(#soft)" opacity="0.8"/>
  <circle cx="458" cy="569" r="17" fill="#FFFFFF"/>
</svg>
