[workspace]
resolver = "2"
members = ["crates/core", "crates/helper", "crates/gui", "crates/tui"]
# The GUI is macOS-only (AppKit menu bar, eframe); Linux builds use
# `cargo build -p wirest-tui -p wirest-helper`.

[workspace.package]
version = "0.2.0"
edition = "2021"
repository = "https://github.com/havban/wirest"

[workspace.dependencies]
wirest-core = { path = "crates/core" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
dirs = "5"

[profile.release]
strip = true
lto = "thin"
