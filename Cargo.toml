[package]
name = "wirest"
version = "0.1.0"
edition = "2021"
description = "One-click WireGuard VPN app for macOS"

[dependencies]
eframe = "0.32"
rfd = "0.15"
x25519-dalek = { version = "2", features = ["static_secrets"] }
getrandom = "0.2"
base64 = "0.22"
dirs = "5"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tray-icon = "0.26.1"

[profile.release]
strip = true
lto = "thin"
